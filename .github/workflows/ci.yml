name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatierung
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit-Tests
        run: npm test

      - name: API-Tests
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mizax_test
